<!doctype html>
<html lang="en" data-map="zombie_cod5_prototype">
<head>
  <meta charset="utf-8">
  <!-- integ12: served at /five/ or /kino/ (vel.gg root routing): resolve relative URLs (and maps.js BASE) from the site directory. -->
  <script>if (/\/(five|kino|nacht)\/$/.test(location.pathname)) document.write('<base href="../">');</script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <title>Nacht der Untoten</title>
  <!-- linkcard: link preview (index.html); mkpages.mjs swaps the map name into og:title. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BO1 Zombies">
  <meta property="og:title" content="Nacht der Untoten | BO1 Zombies">
  <meta property="og:description" content="Black Ops zombies in your browser.">
  <meta property="og:image" content="https://vel.gg/bo1z/art/og-mapselect.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="720">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:,">
  <link rel="preload" as="image" href="art/loadscreen_zombie_cod5_prototype.webp">
  <link rel="stylesheet" href="play.css">
  <link rel="stylesheet" href="modmenu.css">
  <style>:root { --art: url(art/loadscreen_zombie_cod5_prototype.webp); }</style>
</head>
<body data-screen="landing">
  <!-- The canvas carries the map loadscreen art until the engine draws its own loading screen. -->
  <canvas id="game" width="1280" height="720" tabindex="0" aria-label="Nacht der Untoten"></canvas>
  <main id="overlay">
    <div class="prompt">
      <p id="status" role="status" aria-live="polite"></p>
      <p id="error-message" class="error-message" role="alert" hidden></p>
      <details id="error-debug" hidden><summary>Details</summary><pre id="error-debug-message"></pre></details>
      <p id="notice" class="notice" hidden></p>
      <div class="actions">
        <button id="play" class="option" disabled>Loading</button>
        <button id="secondary" class="option" hidden>Try again</button>
      </div>
      <p id="details"></p>
    </div>
    <div id="transfer" class="loadbar" hidden>
      <p id="transfer-details" class="metrics"></p>
      <progress id="progress" max="1" aria-label="Download progress"></progress>
    </div>
    <div id="loading" class="loadbar" hidden>
      <p id="load-details" class="metrics"></p>
      <progress id="load-progress" max="1" aria-label="Loading"></progress>
    </div>
    <details id="settings">
      <summary>Options</summary>
      <div class="settings-body">
        <label for="sensitivity">Mouse Sensitivity <output id="sensitivity-value">5.0</output></label>
        <input id="sensitivity" type="range" min="0.5" max="15" step="0.5" value="5">
        <label for="volume">Master Volume <output id="volume-value">80%</output></label>
        <input id="volume" type="range" min="0" max="1" step="0.05" value="0.5">
        <label class="check"><input id="fullscreen" type="checkbox"> Fullscreen</label>
        <label for="res-scale" style="margin-top:8px;display:block;">Resolution Scale (FPS Boost)</label>
        <select id="res-scale" style="background:#222;color:#fff;border:1px solid #555;padding:4px 6px;border-radius:4px;margin-bottom:8px;width:100%;font-family:inherit;">
          <option value="720p" selected>720p HD (60 FPS Boost - Recommended)</option>
          <option value="540p">540p (Maximum Performance / Potato PC)</option>
          <option value="900p">900p HD+</option>
          <option value="1080p">1080p Full HD</option>
          <option value="native">Native Screen DPI</option>
        </select>
        <label class="check"><input id="perf-overlay-check" type="checkbox"> Show FPS / Performance HUD</label>
        <p id="settings-note"></p>
      </div>
    </details>
  </main>
  <aside id="background" role="status" hidden><span id="background-label"></span><progress id="background-progress" max="1" aria-label="Music and voices download"></progress><button id="background-retry" class="option" hidden>Retry</button></aside>
  <p id="resume-hint" class="resume-hint" hidden>Click to resume</p>
  <script type="module" src="play.js"></script>
  <script type="module" src="modmenu.js"></script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4bc70e2c01a94c73b74392e4234840661791215815920" integrity="sha512-L0ha0OXavK/8okipN9F8BtP84dg9DUhPERbBXzwI6dgTA55d2+yweo3pn5CSFYs45/r8md2+xvUPtTdvTNRfjA==" data-cf-beacon='{"version":"2024.11.0","token":"e0525bc247b0452da98d6920a6f1a445","r":1,"spa":2}' crossorigin="anonymous"></script>
</body>
</html>
